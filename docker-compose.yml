version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vedapavitra-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=vedapavitra_db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vedapavitra-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=vedapavitra_db
      - JWT_SECRET=vedapavitra-sacred-production-secret-key-108
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vedapavitra-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
